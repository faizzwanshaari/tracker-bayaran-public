<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Bayaran</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2f7d5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --green:#2f7d5b; --green-2:#1f5c43; --green-soft:#e8f3ee;
  --red:#c0392b; --ink:#1c2620; --muted:#6b7a72; --line:#e3ebe7;
  --card:#ffffff; --bg:#f3f7f5;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.45;
  background:linear-gradient(180deg,#e9f2ee 0,var(--bg) 320px);
  padding-bottom:40px;
}
header{
  background:linear-gradient(135deg,var(--green) 0%,var(--green-2) 100%);
  color:#fff;padding:18px 18px 22px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px 14px;
  border-radius:0 0 26px 26px;box-shadow:0 10px 30px rgba(31,92,67,.25);
}
header h1{font-size:20px;font-weight:800;margin:0;letter-spacing:.2px}
header input[type=month]{
  font:inherit;font-weight:600;padding:8px 12px;border:0;border-radius:999px;
  background:rgba(255,255,255,.95);color:var(--green-2);outline:none;
}
header button#btnLogin{
  font:inherit;font-weight:700;padding:8px 14px;border:0;border-radius:999px;
  background:#fff;color:var(--green-2);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12);
}
header button#btnLogin:active{transform:translateY(1px)}
main{max-width:640px;margin:0 auto;padding:16px 14px 0;display:grid;gap:14px}
.card{
  background:var(--card);border-radius:20px;padding:18px 18px 14px;
  border:1px solid rgba(20,60,45,.06);box-shadow:0 8px 24px rgba(20,60,45,.07);
}
.card h2{
  font-size:16px;font-weight:800;margin:0 0 12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding-left:12px;position:relative;
}
.card h2::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:4px;background:var(--green)}
.card h2 small{font-weight:700;color:var(--green-2);font-size:13px;background:var(--green-soft);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:12px}
.unpaid h2::before{background:var(--red)}
.unpaid h2 small{color:var(--red);background:#fbe9e7}
.item{
  display:flex;align-items:center;gap:10px;padding:11px 8px;margin:0 -8px;
  border-bottom:1px solid var(--line);border-radius:12px;transition:background .15s;
}
.item:hover{background:#f7fbf9}
.item:last-child{border-bottom:0}
.item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.item .lbl small{font-weight:500}
.item .amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--green-2)}
.item input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--green);cursor:pointer;margin:0}
.item input.amt,.item input.saveAmt,.item input.bayarAmt{
  width:104px!important;padding:8px 10px!important;font-size:14px;text-align:right;
  border:1.5px solid var(--line)!important;border-radius:12px!important;background:#fbfdfc;
  color:var(--ink);font-variant-numeric:tabular-nums;
}
.item input.saveAmt,.item input.bayarAmt{width:92px!important}
.done{text-decoration:line-through;color:#9aa7a0;font-weight:500}
.item button.add{font-size:13px;padding:7px 12px!important;border-radius:999px!important}
.del{
  flex:none;width:30px;height:30px;border-radius:50%;background:#fff;color:#9aa7a0;
  border:1px solid var(--line);font-size:18px;line-height:1;cursor:pointer;padding:0;
}
.del:hover{color:var(--red);border-color:#f2c9c4;background:#fdf3f2}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 8px}
.empty::before{content:"✨";display:block;font-size:22px;margin-bottom:4px}
input,select{
  font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;
  background:#fbfdfc;color:var(--ink);min-width:0;outline:none;width:100%;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(47,125,91,.15);background:#fff}
button.add{
  font:inherit;font-weight:700;padding:11px 16px;border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--green) 0%,var(--green-2) 100%);
  color:#fff;cursor:pointer;box-shadow:0 6px 14px rgba(47,125,91,.25);
  transition:transform .08s,box-shadow .15s;white-space:nowrap;
}
button.add:hover{box-shadow:0 8px 18px rgba(47,125,91,.32)}
button.add:active{transform:translateY(1px)}
form.add{display:grid;grid-template-columns:1fr 120px auto;gap:10px;margin-top:14px}
form.gajiform{grid-template-columns:1fr auto}
.baki{
  margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--green-soft);
  font-size:15px;color:var(--green-2);font-weight:600;font-variant-numeric:tabular-nums;
}
.baki b{font-size:17px}
@media (max-width:520px){
  form.add{grid-template-columns:1fr 1fr}
  form.add input:first-child{grid-column:span 2}
  form.add button.add{grid-column:span 2}
  .card{padding:16px 14px 12px}
  .item{gap:8px}
  .item .lbl{white-space:normal}
}
</style>
</head>
<body>
<header>
  <h1>✅ Tracker Bayaran</h1>
  <input type="month" id="month" aria-label="Pilih bulan">
  <div style="width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button id="btnLogin" type="button" style="font:inherit;padding:6px 12px;border:0;border-radius:8px;background:#fff;color:#2f7d5b;cursor:pointer">Log masuk Google</button>
    <span id="authInfo" style="font-size:12px;opacity:.9"></span>
  </div>
</header>

<main>
  <section class="card">
    <h2>Gaji bulan ni</h2>
    <form id="formGaji" class="add gajiform">
      <input type="number" id="gajiAmt" step="0.01" min="0" placeholder="Jumlah gaji (RM)" required>
      <button class="add" type="submit">Simpan</button>
    </form>
    <div class="baki">Baki selepas semua item: <b id="bakiVal">-</b></div>
  </section>

  <section class="card unpaid">
    <h2>Belum bayar <small id="unpaidTotal"></small></h2>
    <div id="unpaidList"></div>
  </section>

  <section class="card paid">
    <h2>Dah bayar <small id="paidTotal"></small></h2>
    <div id="paidList"></div>
  </section>

  <section class="card">
    <h2>Hutang <small id="hutangTotal"></small></h2>
    <div id="hutangList"></div>
    <form id="formHutang" class="add" style="margin-top:10px">
      <input type="text" id="hutangName" placeholder="Nama (cth: CIMB)" required>
      <input type="number" id="hutangBaki" step="0.01" min="0" placeholder="Baki (RM)" required>
      <button class="add" type="submit">Tambah</button>
    </form>
  </section>

  <section class="card">
    <h2>Simpanan <small id="savingTotal"></small></h2>
    <div id="savingList"></div>
    <form id="formSaving" class="add" style="margin-top:10px">
      <input type="text" id="savingName" placeholder="Nama (cth: Tabung, ASB)" required>
      <input type="number" id="savingBal" step="0.01" min="0" placeholder="Baki (RM)" required>
      <button class="add" type="submit">Tambah</button>
    </form>
  </section>

  <section class="card">
    <h2>Tambah item</h2>
    <form id="formAdd" class="add">
      <input type="text" id="addName" placeholder="Nama (cth: Netflix)" required>
      <input type="number" id="addAmt" step="0.01" min="0" placeholder="RM" required>
      <button class="add" type="submit">Tambah</button>
    </form>
  </section>
</main>

<script>
// Senarai Nov 2026 ikut sheet GAJI 2026. Kuning dalam sheet = dah bayar.
const DEFAULT_ITEMS = [];
const KEY = "bil-bayar-v2";

let db;
try{ db = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
if(!db || !db.months) db = {months:{}};
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); if(window.__upload) window.__upload(db); }

function $(id){ return document.getElementById(id); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ return "RM " + (Number(n)||0).toLocaleString("ms-MY",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
let month = todayStr().slice(0,7);

function items(){
  if(!db.months[month]){
    // Bulan baru: salin senarai dari bulan terakhir yang ada (amount kekal, semua reset belum bayar)
    const prev = Object.keys(db.months).filter(k=>k < month).sort().pop();
    const base = prev ? db.months[prev] : DEFAULT_ITEMS;
    db.months[month] = base.map(b=>({
      id:uid(), name:b.name, tag:b.tag||"", amount:b.amount, paid:false
    }));
    save();
  }
  return db.months[month];
}
function sum(arr){ return arr.reduce((a,b)=>a+b.amount,0); }
function salary(){ return db.salary && db.salary[month] != null ? db.salary[month] : null; }

function row(b){
  return `<div class="item">
    <input type="checkbox" class="paid" data-id="${b.id}" ${b.paid?"checked":""} title="Dah bayar">
    <span class="lbl ${b.paid?"done":""}">${esc(b.name)}${b.tag?` <small class="muted">(${esc(b.tag)})</small>`:""}</span>
    <input type="number" class="amt" data-id="${b.id}" step="0.01" min="0" value="${b.amount}">
    <button class="del" data-del="${b.id}" title="Padam">×</button>
  </div>`;
}

function render(){
  $("month").value = month;
  renderHutang();
  renderSavings();
  const all = items();
  const unpaid = all.filter(b=>!b.paid);
  const paid = all.filter(b=>b.paid);
  const gaji = salary();
  $("gajiAmt").value = gaji == null ? "" : gaji;
  const baki = gaji == null ? null : gaji - sum(all);
  $("bakiVal").textContent = baki == null ? "isi gaji dulu" : money(baki);
  $("bakiVal").style.color = baki != null && baki < 0 ? "var(--bad)" : "";
  $("unpaidTotal").textContent = money(sum(unpaid));
  $("paidTotal").textContent = money(sum(paid));
  $("unpaidList").innerHTML = unpaid.length ? unpaid.map(row).join("") : '<div class="empty">Tiada item lagi. Tambah di bawah.</div>';
  $("paidList").innerHTML = paid.length ? paid.map(row).join("") : '<div class="empty">Belum ada yang dibayar.</div>';
}

$("month").onchange = e=>{ if(e.target.value){ month = e.target.value; render(); } };

$("formGaji").onsubmit = e=>{
  e.preventDefault();
  const v = parseFloat($("gajiAmt").value);
  if(!(v>=0)) return;
  db.salary = db.salary || {};
  db.salary[month] = v;
  save();
  render();
};

$("formAdd").onsubmit = e=>{
  e.preventDefault();
  const name = $("addName").value.trim(), amt = parseFloat($("addAmt").value);
  if(!name || !(amt>=0)) return;
  items().push({id:uid(), name, tag:"", amount:amt, paid:false});
  save();
  $("addName").value = ""; $("addAmt").value = "";
  render();
};

document.addEventListener("change", e=>{
  const t = e.target;
  if(!t.dataset || !t.dataset.id) return;
  const b = items().find(x=>x.id === t.dataset.id);
  if(!b) return;
  if(t.classList.contains("paid")) b.paid = t.checked;
  else if(t.classList.contains("amt")) b.amount = Math.max(0, parseFloat(t.value)||0);
  save();
  render();
});

document.addEventListener("click", e=>{
  const btn = e.target.closest("[data-del]");
  if(!btn) return;
  if(!confirm("Padam item ni?")) return;
  db.months[month] = items().filter(x=>x.id !== btn.dataset.del);
  save();
  render();
});

function renderHutang(){
  db.debts = db.debts || [];
  const debts = db.debts;
  $("hutangTotal").textContent = money(debts.reduce((a,d)=>a+d.balance,0));
  $("hutangList").innerHTML = debts.length
    ? debts.map(d=>`<div class="item">
        <span class="lbl">${esc(d.name)}</span>
        <span class="amt">${money(d.balance)}</span>
        <input type="number" class="bayarAmt" data-id="${d.id}" step="0.01" min="0" placeholder="RM" style="width:90px;padding:6px;border:1px solid var(--line);border-radius:8px;font:inherit">
        <button class="add" data-bayar="${d.id}" style="padding:6px 10px">Tolak</button>
        <button class="del" data-hutdel="${d.id}" title="Padam">×</button>
      </div>`).join("")
    : '<div class="empty">Tiada hutang lagi.</div>';
}

$("formHutang").onsubmit = e=>{
  e.preventDefault();
  const n = $("hutangName").value.trim(), b = parseFloat($("hutangBaki").value);
  if(!n || !(b>=0)) return;
  db.debts = db.debts || [];
  db.debts.push({id:uid(), name:n, balance:b});
  save();
  $("hutangName").value = ""; $("hutangBaki").value = "";
  render();
};

document.addEventListener("click", e=>{
  const bayar = e.target.closest("[data-bayar]");
  const hdel = e.target.closest("[data-hutdel]");
  if(bayar){
    const id = bayar.dataset.bayar;
    const inp = document.querySelector('.bayarAmt[data-id="'+id+'"]');
    const amt = parseFloat(inp && inp.value);
    const d = (db.debts||[]).find(x=>x.id===id);
    if(!d || !(amt>0)) return;
    d.balance = Math.max(0, d.balance - amt);
    save();
    render();
  } else if(hdel){
    if(!confirm("Padam hutang ni?")) return;
    db.debts = (db.debts||[]).filter(x=>x.id !== hdel.dataset.hutdel);
    save();
    render();
  }
});

function renderSavings(){
  db.savings = db.savings || [];
  const list = db.savings;
  $("savingTotal").textContent = money(list.reduce((a,s)=>a+s.balance,0));
  $("savingList").innerHTML = list.length
    ? list.map(s=>`<div class="item">
        <span class="lbl">${esc(s.name)}</span>
        <span class="amt">${money(s.balance)}</span>
        <input type="number" class="saveAmt" data-id="${s.id}" step="0.01" min="0" placeholder="RM" style="width:90px;padding:6px;border:1px solid var(--line);border-radius:8px;font:inherit">
        <button class="add" data-simpan="in" data-sid="${s.id}" style="padding:6px 10px">Masuk</button>
        <button class="add" data-simpan="out" data-sid="${s.id}" style="padding:6px 10px;background:#c0392b">Keluar</button>
        <button class="del" data-savdel="${s.id}" title="Padam">×</button>
      </div>`).join("")
    : '<div class="empty">Tiada simpanan lagi.</div>';
}

$("formSaving").onsubmit = e=>{
  e.preventDefault();
  const n = $("savingName").value.trim(), b = parseFloat($("savingBal").value);
  if(!n || !(b>=0)) return;
  db.savings = db.savings || [];
  db.savings.push({id:uid(), name:n, balance:b});
  save();
  $("savingName").value = ""; $("savingBal").value = "";
  render();
};

document.addEventListener("click", e=>{
  const sim = e.target.closest("[data-simpan]");
  const sdel = e.target.closest("[data-savdel]");
  if(sim){
    const id = sim.dataset.sid;
    const inp = document.querySelector('.saveAmt[data-id="'+id+'"]');
    const amt = parseFloat(inp && inp.value);
    const s = (db.savings||[]).find(x=>x.id===id);
    if(!s || !(amt>0)) return;
    s.balance = sim.dataset.simpan === "in" ? s.balance + amt : Math.max(0, s.balance - amt);
    save();
    render();
  } else if(sdel){
    if(!confirm("Padam simpanan ni?")) return;
    db.savings = (db.savings||[]).filter(x=>x.id !== sdel.dataset.savdel);
    save();
    render();
  }
});

render();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCI_zbhZHGItCdwbZqNm32d_JCBrzIcIfk",
  authDomain: "tracker-bayaran.firebaseapp.com",
  projectId: "tracker-bayaran",
  storageBucket: "tracker-bayaran.firebasestorage.app",
  messagingSenderId: "551361477255",
  appId: "1:551361477255:web:3f35053ce912b1ab9e5622"
});
const auth = getAuth(app);
const fsdb = getFirestore(app);
const ref = doc(fsdb, "tracker", "data");
const ALLOWED_EMAIL = "faizzwanshaari98@gmail.com";
let unsub = null, applying = false;

// Data kosong tak boleh timpa data yang ada
function isEmpty(d){
  const hasItems = Object.values((d && d.months) || {}).some(a => Array.isArray(a) && a.length > 0);
  const hasDebts = !!(d && d.debts && d.debts.length);
  const hasSavings = !!(d && d.savings && d.savings.length);
  return !hasItems && !hasDebts && !hasSavings;
}

// Dipanggil setiap kali save() — hantar data ke Firestore kalau dah log masuk
window.__upload = (data) => {
  if (applying || !auth.currentUser || isEmpty(data)) return;
  setDoc(ref, { payload: JSON.stringify(data), updated: Date.now() }).catch(e => console.error(e));
};

const btn = document.getElementById("btnLogin");
const info = (t) => { document.getElementById("authInfo").textContent = t; };

btn.onclick = async () => {
  if (auth.currentUser) { await signOut(auth); return; }
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { info("Log masuk gagal: " + (e.code || e.message)); }
};

onAuthStateChanged(auth, async (user) => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { btn.textContent = "Log masuk Google"; info("Data hanya dalam browser ni"); return; }
  if (user.email !== ALLOWED_EMAIL) { info("Akaun ni tak dibenarkan"); await signOut(auth); return; }
  btn.textContent = "Log keluar";
  info("Sync: " + user.email);
  const snap = await getDoc(ref);
  const remoteEmpty = !snap.exists() || isEmpty(JSON.parse(snap.data().payload || "{}"));
  if (remoteEmpty && !isEmpty(db)) window.__upload(db);
  unsub = onSnapshot(ref, (s) => {
    if (!s.exists()) return;
    const remote = s.data().payload;
    if (!remote) return;
    if (isEmpty(JSON.parse(remote))) return;
    if (remote !== JSON.stringify(db)) {
      if (!isEmpty(db)) localStorage.setItem(KEY + "-backup", JSON.stringify(db));
      applying = true;
      db = JSON.parse(remote);
      localStorage.setItem(KEY, remote);
      applying = false;
      render();
    }
  });
});
</script>
</body>
</html>
